name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # OMDb key (IMDb ratings) comes from a repository secret; it is not stored in the source.
      - name: Write OMDb key
        shell: bash
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          if [ -n "$OMDB_KEY" ]; then printf '%s' "$OMDB_KEY" > .omdb-key; fi
      - run: npm run build
      - run: node scripts/fetch-ffmpeg.mjs
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ocean-player-windows
          path: |
            release/*.exe
            release/*.zip
      # A version tag (v0.2.0 …) publishes a GitHub Release; Ocean's updater reads it.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Ocean-Player-Setup-*.exe
            release/Ocean-Player-*-win-x64.zip
          generate_release_notes: true
